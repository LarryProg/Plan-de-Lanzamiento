<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Plan de Lanzamiento · @larry.prod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Caveat:wght@600&family=Special+Elite&family=DM+Mono:wght@400;500&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a; --card:#131313; --card2:#1a1a1a; --line:#272727; --line2:#353535;
    --text:#f0ede6; --muted:#9a968e; --dim:#615e58; --white:#ffffff;
    --ok:#7fd49b; --r:14px; --px:#000;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;font-size:16.5px;line-height:1.5;height:100%;overflow:hidden}
  a{color:inherit}
  button{font-family:inherit}
  .mono{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .ps{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.04em;line-height:1.5}
  h1,h2,h3{font-family:'Syne',sans-serif;line-height:1.1;letter-spacing:-.01em}
  .dots-bg{background:#2a79d3 var(--sky) center bottom / cover no-repeat;image-rendering:pixelated}

  /* ── GATE ── */
  #gate{position:fixed;inset:0;z-index:999;background:#1a58b4 var(--sky) center bottom / cover no-repeat;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .4s}
  #gate.hide{opacity:0;pointer-events:none}
  .gate-card{width:100%;max-width:360px;text-align:center}
  .gate-card img{width:104px;margin-bottom:20px;filter:drop-shadow(3px 3px 0 #0b2c5c)}
  .gate-box{background:#fff;color:#141414;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:20px 18px}
  .gate-card h3{font-family:'Press Start 2P',monospace;font-weight:400;font-size:12px;line-height:1.5;margin-bottom:10px}
  .gate-card p{font-family:'VT323',monospace;font-size:21px;line-height:1.1;color:#3d3a35;margin-bottom:16px}
  .gate-card input{width:100%;background:#fff;border:3px solid #000;color:#141414;padding:12px 14px;font-size:16px;text-align:center;font-family:'DM Mono',monospace;letter-spacing:.1em;outline:none}
  .gate-card .err{color:#b2402c;font-size:14px;min-height:22px;margin:8px 0}
  .gbtn{width:100%;background:#7fff5f;color:#000;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:12px;font-family:'Press Start 2P',monospace;font-size:11px;cursor:pointer}
  .gbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .shake{animation:shake .3s}

  /* ═══ LAYOUT: Larry al costado + chat ═══ */
  .app{display:grid;grid-template-columns:330px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
  .chat,.thread{min-height:0}
  .side.dots-bg{background:linear-gradient(rgba(8,10,22,.82),rgba(8,10,22,.82)),#2a79d3 var(--sky) center bottom / cover no-repeat}
  .side{border-right:3px solid #1d1d24;display:flex;flex-direction:column;padding:18px;gap:14px;overflow-y:auto;scrollbar-width:none}
  .side-stage{position:relative;flex:none;height:250px;background:#121218;border:3px solid #2c2c36;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .side-stage::after,.scene::after{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,#2c2c36 0 12px,#23232b 12px 24px)}
  .side-stage .larry{width:164px;margin-bottom:0}
  .side-stage::after{display:none}
  .st-back,.st-front{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
  .st-back{z-index:0}.st-front{z-index:2}
  .prop{z-index:3!important}
  .sbox{position:relative;flex:none;align-self:stretch;width:170px;margin-left:-18px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-right:3px solid #2c2c36}
  .side-stage .prop.main{left:calc(50% + 52px);top:30px;width:36px}
  .who{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .who b{font-family:'Press Start 2P',monospace;font-size:15px;font-weight:400}
  .stat{font-family:'VT323',monospace;font-size:20px;color:#7fff5f;white-space:nowrap}
  body.typing .stat{color:#ffd54a}
  .handle{font-family:'VT323',monospace;font-size:19px;color:#9a968e;margin-top:-10px}
  .handle a{text-decoration:none;color:#f0ede6}
  .route{display:flex;flex-direction:column;gap:4px}
  .route .lbl{color:#77757f;margin:6px 0 6px}
  .route button{display:flex;gap:10px;align-items:center;width:100%;background:transparent;border:2px solid transparent;color:#d6d2ca;padding:9px 10px;font-size:15px;text-align:left;cursor:pointer}
  .route button:hover{background:#16161d}
  .route button .n{font-family:'Press Start 2P',monospace;font-size:9px;color:#77757f;width:22px;flex:none}
  .route button .s{margin-left:auto;font-size:13px;color:#7fff5f;font-family:'VT323',monospace;font-size:19px}
  .route button.cur{border-color:#fff;background:#18181f;color:#fff;box-shadow:3px 3px 0 #000}
  .route button.lock{opacity:.38;cursor:default}
  .route button.lock:hover{background:transparent}
  .side-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;border-top:2px solid #1d1d24}
  .saved{font-family:'VT323',monospace;font-size:18px;color:#615e58}
  .linkbtn{background:none;border:none;color:#77757f;font-family:'VT323',monospace;font-size:18px;cursor:pointer}
  .linkbtn:hover{color:#fff}

  .chat{display:flex;flex-direction:column;min-width:0;height:100%}
  .chead{flex:none;display:flex;align-items:center;gap:14px;padding:12px 18px;background:#1a58b4 var(--sky) left 0 / cover no-repeat;image-rendering:pixelated;border-bottom:3px solid #000}
  .hdl{font-family:'Press Start 2P',monospace;font-size:9px;color:#fff;text-decoration:none;text-shadow:2px 2px 0 #0b2c5c;white-space:nowrap}
  #menuBtn{display:none;background:none;border:2px solid #2c2c36;color:#fff;width:38px;height:38px;font-size:18px;cursor:pointer;flex:none}
  .mav{display:none;flex:none;width:42px;height:42px;background:#1b1b22;border:2px solid #000;box-shadow:2px 2px 0 #000;overflow:hidden;justify-content:center}
  .mav.larry svg{width:38px;margin-top:2px}
  .ttl{min-width:0;flex:1}
  .ttl b{display:block;font-family:'Press Start 2P',monospace;font-weight:400;font-size:13px;color:#fff;text-shadow:2px 2px 0 #0b2c5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  .ttl small{display:inline-block;max-width:100%;margin-top:6px;background:#fff;color:#141414;border:2px solid #000;box-shadow:2px 2px 0 #000;padding:0 8px;font-family:'VT323',monospace;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.typing .ttl small{background:#ffd54a}
  .pbar{flex:none;height:6px;background:#1d1d24}
  .pbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#7fff5f 0 8px,#58d63a 8px 16px);transition:width .5s steps(6)}

  .thread{flex:1;overflow-y:auto;padding:20px 18px 34px}
  .tin{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .intro{text-align:center;padding:16px 0 18px}
  .intro img{width:76px;margin-bottom:14px}
  .intro h1{font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(20px,4vw,34px);line-height:1.45;letter-spacing:0;text-shadow:4px 4px 0 #0b2c5c;color:#fff}
  .intro .byline{font-family:'DM Mono',monospace;font-size:14px;color:#fff;margin:8px 0 12px;text-shadow:2px 2px 0 #0b2c5c}
  .intro .byline a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line2)}
  .intro .ps{color:#dbe9ff;text-shadow:1px 1px 0 #0b2c5c}
  .intro img{filter:drop-shadow(2px 2px 0 #0b2c5c)}

  /* mensajes */
  .row{display:flex;gap:10px;align-items:flex-start;animation:msgin .3s steps(4) both}
  .row.u{justify-content:flex-end}
  .row.c{display:block}
  @keyframes msgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .av{flex:none;width:40px;height:40px;background:#1b1b22;border:2px solid #000;box-shadow:2px 2px 0 #000;overflow:hidden;display:flex;justify-content:center}
  .av svg{width:34px;height:auto;margin-top:3px;image-rendering:pixelated}
  .row.l + .row.l .av, .row.l + .row.tmp .av{visibility:hidden}
  .col{min-width:0;max-width:min(560px,84%)}
  .row.wide .col{max-width:min(620px,100%);flex:1}
  .bub{background:#fff;color:#141414;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px 14px 11px}
  .bub .vt{font-family:'VT323',monospace;font-size:23px;line-height:1.12}
  .bub .vt + .vt{margin-top:6px}
  .bub .opt{color:#8f897e;font-size:19px}
  .bub .hint{font-size:14.5px;color:#5f5a52;margin-top:6px;line-height:1.42}
  .bub .ex{margin-top:9px;background:#f6f3ec;border:2px dashed #cfc7b7;padding:7px 10px;font-size:14.5px;color:#3d3a35;line-height:1.4}
  .bub .ex strong{font-weight:700;color:#141414}
  .bub b.lb,.bub .ex b.lb{font-weight:700;display:inline;font-family:inherit;font-size:inherit;color:inherit;margin:0;-webkit-text-stroke:.6px currentColor}
  .bub .ex b{display:block;font-family:'Press Start 2P',monospace;font-size:7.5px;color:#8f897e;margin-bottom:5px;font-weight:400}
  .bub .grp{display:inline-block;font-family:'Press Start 2P',monospace;font-size:8.5px;background:#141414;color:#fff;padding:5px 7px;margin-bottom:9px}
  .bub .qn{display:inline-block;font-family:'Press Start 2P',monospace;font-size:7.5px;color:#8f897e;margin-top:6px}
  .bub .fixl{font-size:15px;margin-top:7px;line-height:1.4}
  .bub .fixl b{font-weight:700}
  .bub.err{background:#ffe9e4}
  .typingb{display:inline-flex;gap:6px;padding:14px 16px}
  .typingb i{width:8px;height:8px;background:#141414;animation:tdot 1s steps(1) infinite}
  .typingb i:nth-child(2){animation-delay:.33s}.typingb i:nth-child(3){animation-delay:.66s}
  @keyframes tdot{0%,60%{opacity:.2}30%{opacity:1}}
  .ubub{background:#f3ead8;color:#141414;border:3px solid #000;box-shadow:-4px 4px 0 #000;padding:9px 14px;font-size:16px;white-space:pre-wrap;word-break:break-word;position:relative;line-height:1.42}
  .ubub.ed{cursor:pointer}
  .ubub.ed::after{content:'✎';position:absolute;left:-26px;top:50%;transform:translateY(-50%);font-size:15px;color:#615e58;opacity:0;transition:.15s}
  .ubub.ed:hover::after{opacity:1}
  .ubub .skip{opacity:.55;font-style:italic}
  .ubub .sw{display:inline-flex;gap:5px;vertical-align:middle}
  .ubub .sw i{width:22px;height:22px;border:2px solid #000}

  /* tarjetas dentro del chat (claras) */
  .mcard,.sheet{
    --card:#f6f3ec; --card2:#ece7dc; --line:#e2dccf; --line2:#cfc7b7;
    --text:#151515; --muted:#5f5a52; --dim:#8f897e; --white:#151515;
    background:var(--card);color:var(--text);border:3px solid #000;box-shadow:4px 4px 0 #000;padding:16px}
  .mcard.bare{--text:#f0ede6;--muted:#9a968e;--dim:#615e58;background:transparent;border:none;box-shadow:none;padding:0}
  .mcard h3{font-size:17px;margin-bottom:8px}
  .wfoot{display:flex;justify-content:flex-end;margin-top:14px}
  .btnp{background:#7fff5f;color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer}
  .btnp:active,.qb:active,#csend:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  .btnw{background:#fff;color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:9px 14px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}

  /* escena de cada parada (animación) */
  .scene{position:relative;height:170px;background:#121218;border:3px solid #2c2c36;overflow:hidden;display:flex;align-items:flex-end;padding:0 18px;gap:22px;margin:20px 0 4px;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:16px 16px}
  .scene .larry{width:104px;margin-bottom:0;flex:none}
  .scene .prop.main{left:122px;top:12px;width:26px}
  .scene::after{display:none}
  .scene-t{align-self:center;padding-bottom:6px;min-width:0;z-index:1}
  .scene-t .ps{color:#7fff5f}
  .scene-t .ps.dim{color:#77757f}
  .scene-t .iglink{display:inline-block;color:#fff;text-decoration:none;border-bottom:2px solid #7fff5f;padding-bottom:3px}
  .scene-t .iglink:hover{color:#7fff5f}
  .scene-t h3{font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(14px,2.6vw,22px);line-height:1.35;color:#fff;margin:10px 0 8px}

  /* barra de abajo */
  .dock{flex:none;background:rgba(10,10,14,.9);backdrop-filter:blur(6px);border-top:3px solid #1d1d24;padding:10px 18px calc(12px + env(safe-area-inset-bottom))}
  .dock .inner{max-width:780px;margin:0 auto}
  .quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
  .quick:empty{display:none}
  .qb{background:#fff;color:#141414;border:3px solid #000;box-shadow:3px 3px 0 #555;padding:8px 14px;cursor:pointer;font-size:15px;font-weight:600;text-align:left;line-height:1.25}
  .qb small{display:block;font-weight:400;font-size:12.5px;color:#666;font-family:'Barlow',sans-serif;text-transform:none;letter-spacing:0}
  .qb.pri{background:#7fff5f}
  .qb.chip{background:transparent;color:#f0ede6;border:2px solid #3a3a44;box-shadow:none;padding:6px 12px;font-size:14px;font-weight:500}
  .qb.chip:hover{border-color:#aaa}
  .qb.ghost{background:transparent;color:#9a968e;border:2px dashed #3a3a44;box-shadow:none;font-weight:500}
  .dockhint{font-family:'VT323',monospace;font-size:21px;color:#9a968e;align-self:center}
  .composer{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
  .quick:empty + .composer{margin-top:0}
  .composer[hidden]{display:none}
  .composer textarea{flex:1;min-width:0;background:#fff;color:#141414;border:3px solid #000;box-shadow:3px 3px 0 #555;padding:10px 12px;font-family:'Barlow',sans-serif;font-size:16.5px;line-height:1.4;resize:none;max-height:190px;outline:none}
  .composer textarea::placeholder{color:#a9a397}
  #csend{flex:none;width:54px;height:50px;background:#7fff5f;border:3px solid #000;box-shadow:3px 3px 0 #555;font-family:'Press Start 2P',monospace;font-size:15px;cursor:pointer}

  /* editar respuesta */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
  #modal[hidden]{display:none}
  .sheet{width:100%;max-width:580px;max-height:86vh;overflow:auto;box-shadow:6px 6px 0 #000;padding:20px}
  .sheet .ps{color:#8f897e}
  .sheet h3{font-family:'VT323',monospace;font-weight:400;font-size:26px;line-height:1.1;margin:8px 0 14px}
  #scrim{display:none}

  /* entradas (en tarjetas y al editar) */
  .wfield input[type=text],.wfield input[type=url],.wfield textarea{width:100%;background:#fff;border:2px solid #000;color:#151515;padding:11px 13px;font-family:'Barlow';font-size:16.5px;line-height:1.5;outline:none}
  .wfield textarea{resize:vertical;min-height:90px}
  .wfield ::placeholder{color:#a9a397}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:2px solid var(--line2);background:#fff;color:var(--text);padding:7px 12px;font-size:14.5px;cursor:pointer;line-height:1.2}
  .chip:hover{border-color:#151515}
  .chip.sel{background:#151515;color:#fff;border-color:#151515}
  .chips-note{font-size:13px;color:var(--dim);margin-top:8px}
  .choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .choice button{background:#fff;border:2px solid var(--line2);color:var(--text);padding:12px;cursor:pointer;text-align:left;font-size:15px}
  .choice button small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .choice button.sel{border-color:#151515;box-shadow:0 0 0 1px #151515 inset}
  .yn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
  .yn:first-child{border-top:none;padding-top:0}
  .yn span{font-size:15.5px}
  .yn .seg{display:flex;flex:none;border:2px solid #151515}
  .yn .seg button{background:#fff;border:none;color:var(--muted);padding:6px 11px;font-size:14px;cursor:pointer}
  .yn .seg button.sel.si{background:#7fff5f;color:#000}
  .yn .seg button.sel.no{background:#151515;color:#fff}
  .colors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .colors label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;text-align:center;line-height:1.2}
  .colors input{appearance:none;-webkit-appearance:none;width:100%;aspect-ratio:1;border:3px solid #000;background:none;cursor:pointer;padding:0}
  .colors input::-webkit-color-swatch-wrapper{padding:0}
  .colors input::-webkit-color-swatch{border:none}
  .colors input::-moz-color-swatch{border:none}
  .mini-btn{background:#fff;border:2px solid var(--line2);color:var(--text);padding:7px 12px;font-size:14px;cursor:pointer;margin-top:10px}
  .mini-btn:hover{border-color:#151515}
  .traps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
  .trap{background:#fff;border:2px solid var(--line2);padding:12px;cursor:pointer;text-align:left;color:var(--text)}
  .trap .e{font-size:22px}
  .trap h4{font-family:'Syne';font-size:15px;margin:6px 0 4px}
  .trap p{font-size:13.5px;color:var(--muted);line-height:1.4}
  .trap.sel{border-color:#151515;box-shadow:0 0 0 1px #151515 inset;background:#fffbe9}

  /* visuales */
  .visual{margin:0}
  .vis-title{margin-bottom:12px;color:var(--muted)}
  .ladder{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ladder div{padding:10px 14px;text-align:center;font-size:14px;border:2px solid var(--line2);background:#fff}
  .ladder div b{display:block;font-family:'DM Mono';font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .ladder div i{font-style:normal;color:var(--dim);font-size:12.5px;display:block}
  .ladder .l4{background:#151515;color:#fff;border-color:#151515}
  .ladder .l4 b,.ladder .l4 i{color:#aaa}
  .output{background:#fff;color:#0a0a0a;border:2px solid #000;padding:18px 20px;margin:0}
  .output .mono{color:#666;margin-bottom:8px;display:block}
  .output p{font-family:'Syne';font-weight:700;font-size:19px;line-height:1.35}
  .output .ph{color:#aaa;border-bottom:1.5px dashed #bbb}
  .output .copy{margin-top:12px;background:#0a0a0a;color:#fff;border:none;padding:8px 14px;font-size:14px;cursor:pointer}
  .persona{display:flex;gap:16px;align-items:center;background:#fff;border:2px solid var(--line2);padding:16px}
  .avatar{flex:none;width:64px;height:64px;border-radius:50%;background:var(--card2);border:2px solid #000;display:flex;align-items:center;justify-content:center;font-family:'Syne';font-weight:800;font-size:26px}
  .persona h4{font-family:'Syne';font-size:20px}
  .persona p{color:var(--muted);font-size:14.5px}
  .persona .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

  /* Larry pixel */
  .larry{position:relative;flex:none;z-index:1}
  .larry .bob{animation:bob 1.1s steps(2) infinite}
  .larry svg{display:none;width:100%;height:auto;image-rendering:pixelated}
  .larry[data-frame="base"] svg[data-f="base"],.larry[data-frame="blink"] svg[data-f="blink"],.larry[data-frame="talk"] svg[data-f="talk"],
  .larry[data-frame="blinktalk"] svg[data-f="blinktalk"],.larry[data-frame="up"] svg[data-f="up"]{display:block}
  .prop{position:absolute;z-index:2;image-rendering:pixelated;animation:float 1.4s steps(3) infinite}
  .prop svg{width:100%;height:auto;display:block}
  .rec{position:absolute;top:10px;right:12px;font-family:'Press Start 2P',monospace;font-size:9px;color:#ff4d6d;animation:blinkr 1s steps(1) infinite;z-index:2}
  .spark{position:absolute;z-index:2;animation:float 1.4s steps(3) infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes blinkr{50%{opacity:0}}
  @keyframes in-slide{0%{transform:translateX(-170%)}100%{transform:none}}
  @keyframes in-jump{0%{transform:translateY(110%)}55%{transform:translateY(-22%)}78%{transform:translateY(4%)}100%{transform:none}}
  @keyframes in-pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes in-rise{0%{transform:translateY(100%);opacity:0}100%{transform:none;opacity:1}}
  .in-slide{animation:in-slide .7s steps(7) both}
  .in-jump{animation:in-jump .75s steps(8) both}
  .in-pop{animation:in-pop .5s steps(5) both}
  .in-rise{animation:in-rise .8s steps(8) both}
  .prop.in{animation:in-pop .4s steps(4) .6s both, float 1.4s steps(3) 1s infinite}
  .scene-t.in{animation:in-pop .4s steps(4) .35s both}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:7px 14px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:95}
  .toast.on{opacity:1}

/* ═══ NOCHE — pisa los azules celestes del motor con azul noche + acento amarillo luna.
   (El archivo se sigue llamando sunset.css.) Se inserta al final del <style> del template:
   con el mismo selector alcanza. ═══ */
:root{ --sun:#ffd86b; --sun2:#ffb347; --dusk:#0d1430; --dusk2:#0a1028; --plum:#16234a; }

/* fondos con la noche (el color de base es el del cielo de arriba, por si la imagen tarda) */
.dots-bg{background:#0d1430 var(--sky) center bottom / cover no-repeat;image-rendering:pixelated}
#gate{background:#070b1e var(--sky) center bottom / cover no-repeat;image-rendering:pixelated}
.gate-card img{filter:drop-shadow(3px 3px 0 #050816)}
.gbtn{background:var(--sun)}

/* costado: velo azul noche */
.side.dots-bg{background:linear-gradient(rgba(8,12,30,.84),rgba(8,12,30,.84)),#0d1430 var(--sky) center bottom / cover no-repeat}
.side{border-right-color:#18213d}
.side-stage{background:#0e1428;border-color:#26304e}
.side-stage::after,.scene::after{background:repeating-linear-gradient(90deg,#26304e 0 12px,#1b2440 12px 24px)}
.sbox{border-right-color:#26304e}
.stat{color:var(--sun)}
body.typing .stat{color:#fff1b8}
.route button:hover{background:#141d38}
.route button.cur{background:#18223f}
.route button .s{color:var(--sun)}
.side-foot{border-top-color:#18213d}
#menuBtn{border-color:#2c3a5e}

/* encabezado del chat: toma la parte de arriba del cielo (azul noche con estrellas) */
.chead{background:#070b1e var(--sky) center 0 / cover no-repeat;image-rendering:pixelated}
.hdl,.ttl b{text-shadow:2px 2px 0 #050816}
body.typing .ttl small{background:#fff1b8}
.pbar{background:#18213d}
.pbar i{background:repeating-linear-gradient(90deg,#ffd86b 0 8px,#ffb347 8px 16px)}

/* portada: sombras azul muy oscuro */
.intro h1{text-shadow:4px 4px 0 #050816}
.intro .byline{text-shadow:2px 2px 0 #050816}
.intro .ps{color:#dfe8ff;text-shadow:1px 1px 0 #050816}
.intro img{filter:drop-shadow(2px 2px 0 #050816)}

/* avatares y escenas */
.av,.mav{background:#141d38}
.scene{background-color:#0e1428;border-color:#26304e}
.scene-t .ps{color:var(--sun)}
.scene-t .iglink{border-bottom-color:var(--sun)}
.scene-t .iglink:hover{color:var(--sun)}

/* barra de abajo y botones */
.dock{background:rgba(8,12,30,.9);border-top-color:#18213d}
.qb{box-shadow:3px 3px 0 #050816}
.qb.pri,.btnp,#csend{background:var(--sun)}
.qb.chip{border-color:#3a4a72;color:#eef2fb}
.qb.chip:hover{border-color:var(--sun)}
.qb.ghost{border-color:#3a4a72;color:#b9c3da}
.dockhint{color:#b9c3da}
.composer textarea,#csend{box-shadow:3px 3px 0 #050816}

/* detalles verdes del motor → amarillo luna */
.yn .seg button.sel.si,.chk.on .box{background:var(--sun)}
.vibe span{border-color:#3a4a72}

/* scrollbar del hilo */
.thread{scrollbar-color:#3a5578 transparent}
.thread::-webkit-scrollbar{width:10px}
.thread::-webkit-scrollbar-track{background:transparent}
.thread::-webkit-scrollbar-thumb{background:#3a5578;border:2px solid #070b1e}
.thread::-webkit-scrollbar-thumb:hover{background:#557aa0}
::selection{background:var(--sun);color:#000}

/* textos chicos del costado: gris azulado claro para que se lean sobre el azul noche */
.route .lbl,.route button .n,.saved,.linkbtn,.handle{color:#a3afc8}
.linkbtn:hover{color:#fff}

/* ═══ PLAN PERSONALIZADO (agente PLAN) — tarjetas finales del chat ═══ */
.pl-card{--ink:#1b1320;--mut:#5b5060;--cream:#fff8ec;--cream2:#f6ead6;--cv:#ffaa33;--cc:#ff7eb6;--ck:#7fd4ff;--cl:#ffd54a;
  background:var(--cream);color:var(--ink);border:3px solid #000;box-shadow:5px 5px 0 #000;padding:18px;font-family:'Barlow',sans-serif;font-size:15.5px;line-height:1.45}
.pl-card *{box-sizing:border-box}
.pl-card a{color:inherit}
.pl-card .ps{font-family:'Press Start 2P',monospace;font-size:8.5px;letter-spacing:.04em;line-height:1.6;color:inherit}
.pl-kick{display:inline-block;background:var(--ink);color:#fff !important;padding:6px 8px;margin-bottom:10px}
.pl-lead{font-size:16px;margin-bottom:14px}
.pl-small{font-size:14px;color:var(--mut);margin-top:8px}

.pl-stars{display:inline-flex;gap:2px;vertical-align:-2px}
.pl-stars svg{fill:#d9cdb8}
.pl-stars svg.on{fill:var(--ink)}
.pl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;font-weight:600;color:var(--mut);margin:6px 0 8px}

/* video vertical */
.pl-vid{position:relative;width:100%;aspect-ratio:9/16;background:#1b1320;border:3px solid #000;overflow:hidden}
.pl-vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1}
.pl-vid iframe[data-src]{display:none}
.pl-play{position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 4px,transparent 4px 8px),
  linear-gradient(180deg,#3d1d52 0%,#a83a6c 55%,#ff8a4c 100%)}
.pl-play::after{content:'';position:absolute;left:50%;top:50%;width:0;height:0;margin:-16px 0 0 -10px;border-style:solid;border-width:16px 0 16px 26px;border-color:transparent transparent transparent #fff;filter:drop-shadow(3px 3px 0 #000)}
.pl-novid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#fff;padding:12px;aspect-ratio:9/12}
.pl-novid small{font-size:13px;opacity:.8}

/* ── 1) elegí tu viral ── */
.pl-vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pl-vopt{position:relative;display:flex;flex-direction:column;background:#fff;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:8px;transition:transform .12s}
.pl-vopt.sel{background:#fff1d6;box-shadow:5px 5px 0 var(--cv),5px 5px 0 2px #000;transform:translate(-2px,-2px)}
.pl-tag{display:inline-block;align-self:flex-start;font-family:'Press Start 2P',monospace;font-size:7px;line-height:1.5;background:var(--cv);color:#000;border:2px solid #000;padding:4px 5px;margin-bottom:7px}
.pl-vopt h4{font-family:'Barlow',sans-serif;font-weight:700;font-size:15px;line-height:1.2;margin:9px 0 0}
.pl-vtxt{display:flex;flex-direction:column;flex:1}
.pl-vtxt p{font-size:13.5px;color:var(--mut);line-height:1.35;flex:1}
.pl-pick{margin-top:10px;width:100%;background:#fff;color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:9px 8px;font-family:'Press Start 2P',monospace;font-size:9px;cursor:pointer}
.pl-pick:hover{background:#ffe7bf}
.pl-vopt.sel .pl-pick{background:#7fff5f}
.pl-pick:active,.pl-big:active,.pl-cbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}

/* ── 2) plan ── */
.pl-plan{padding:0;overflow:hidden}
.pl-hero{position:relative;background:#1b1320;color:#fff;padding:20px 18px 16px;border-bottom:3px solid #000}
.pl-sky{height:14px;margin:-20px -18px 16px;background:linear-gradient(90deg,#3d1d52 0 16.6%,#7a2a6a 16.6% 33.3%,#c2416e 33.3% 50%,#ff6f61 50% 66.6%,#ff8a4c 66.6% 83.3%,#ffd54a 83.3%)}
.pl-hk{color:#ffd54a !important}
.pl-hn{font-family:'Press Start 2P',monospace;font-size:clamp(18px,4.2vw,26px);line-height:1.3;margin:10px 0 4px;text-shadow:3px 3px 0 #c2416e;word-break:break-word}
.pl-ht{font-family:'VT323',monospace;font-size:28px;line-height:1.05;color:#ffe2c4}
.pl-ht small{font-size:21px;color:#c9b3c9}
.pl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:14px}
.pl-stats div{background:#2a1d33;border:2px solid #000;box-shadow:2px 2px 0 #000;padding:7px 9px;min-width:0}
.pl-stats .ps{color:#c9b3c9 !important;font-size:7px;display:block}
.pl-stats b{display:block;font-family:'VT323',monospace;font-weight:400;font-size:22px;line-height:1.05;margin-top:3px;word-break:break-word}
.pl-stats b i{font-style:normal;font-size:16px;color:#c9b3c9}
.pl-avisos{padding:12px 18px 0;display:flex;flex-direction:column;gap:8px}
.pl-aviso{background:#fff3c4;border:2px solid #000;padding:9px 12px 9px 38px;font-size:14.5px;position:relative}
.pl-aviso::before{content:'!';position:absolute;left:10px;top:9px;width:18px;height:18px;background:#000;color:#ffd54a;font-family:'Press Start 2P',monospace;font-size:9px;display:flex;align-items:center;justify-content:center}
.pl-sec{padding:18px;border-top:3px dashed #e3d4bb}
.pl-avisos + .pl-sec,.pl-hero + .pl-sec{border-top:none}
.pl-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-family:'Press Start 2P',monospace;font-weight:400;font-size:11.5px;line-height:1.5}
.pl-h small{display:block;font-family:'Barlow',sans-serif;font-size:14px;color:var(--mut);letter-spacing:0;margin-top:3px;line-height:1.3}
.pl-num{flex:none;width:28px;height:28px;background:var(--ink);color:#ffd54a;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:2px 2px 0 #c2416e}
.pl-p{margin-bottom:12px}
.pl-cv,.pl-cc,.pl-ck{padding:0 4px;border:2px solid #000}
.pl-cv{background:var(--cv)}.pl-cc{background:var(--cc)}.pl-ck{background:var(--ck)}
.pl-badge{display:inline-block;font-family:'Press Start 2P',monospace;font-size:7px;line-height:1.5;background:var(--c);color:#000;border:2px solid #000;padding:3px 5px;white-space:nowrap}

/* receta */
.pl-et{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.pl-et b{font-size:18px;font-weight:700;line-height:1.2}
.pl-rec{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:16px;align-items:start}
.pl-rec-vid{display:flex;flex-direction:column;gap:6px}
.pl-vlink{font-size:13px;font-weight:600}
.pl-why{margin-bottom:2px}
.pl-pasos{margin:8px 0 10px;padding:0;list-style:none;counter-reset:p}
.pl-pasos li{counter-increment:p;position:relative;padding:0 0 8px 34px;font-size:15px}
.pl-pasos li::before{content:counter(p);position:absolute;left:0;top:1px;width:24px;height:24px;background:#fff;border:2px solid #000;font-family:'Press Start 2P',monospace;font-size:9px;display:flex;align-items:center;justify-content:center}
.pl-nota{background:#ffe9cc;border-left:5px solid var(--cv);padding:7px 10px;font-size:14px;margin-bottom:10px}
.pl-copy{position:relative;background:#fff;border:2px solid #000;padding:8px 78px 8px 10px;margin-bottom:8px}
.pl-copy .ps{display:block;font-size:7px;color:var(--mut) !important;margin-bottom:3px}
.pl-copytxt{font-size:15px;font-weight:600;white-space:pre-wrap;word-break:break-word}
.pl-cbtn{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;border:2px solid #000;box-shadow:2px 2px 0 #c2416e;padding:5px 8px;font-size:12.5px;font-weight:700;cursor:pointer}
.pl-cbtn:active{transform:translate(1px,calc(-50% + 1px))}
.pl-ojo{background:#ffe4ea;border:2px solid #000;padding:8px 10px;font-size:14px}
.pl-gan{margin:10px 0;background:var(--cream2);border:2px dashed #b9a88d;padding:10px}
.pl-gan > .ps{display:block;font-size:7px;color:var(--mut) !important;margin-bottom:6px}
.pl-gan small{display:block;font-size:13px;color:var(--mut)}
.pl-copy-s{padding:6px 74px 6px 10px;margin-bottom:6px}
.pl-copy-s .pl-copytxt{font-size:14.5px}

/* semanas de reels */
.pl-week{margin-bottom:14px}
.pl-wh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:7px}
.pl-wh .ps{background:var(--ink);color:#fff !important;padding:4px 7px}
.pl-wh small{font-size:13.5px;color:var(--mut)}
.pl-reel{background:#fff;border:3px solid #000;border-left:10px solid var(--c);box-shadow:3px 3px 0 #000;margin-bottom:8px}
.pl-rs{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;list-style:none}
.pl-rs::-webkit-details-marker{display:none}
.pl-rdate{flex:none;width:42px;text-align:center;font-family:'Press Start 2P',monospace;font-size:7px;line-height:1.3;color:var(--mut)}
.pl-rdate b{display:block;font-family:'VT323',monospace;font-weight:400;font-size:26px;line-height:1;color:var(--ink)}
.pl-rt{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.25}
.pl-arrow{flex:none;font-size:14px;transition:transform .15s}
details[open] > .pl-rs .pl-arrow{transform:rotate(90deg)}
details[open] > .pl-rs{border-bottom:2px dashed #e3d4bb}
.pl-rbody{padding:12px}
.pl-rbody .pl-rec{grid-template-columns:minmax(130px,170px) minmax(0,1fr)}

/* calendario */
.pl-prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13.5px;font-weight:600}

.pl-mc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:44px;background:var(--c,#fff);border:2px solid #000;cursor:pointer;font-family:'VT323',monospace;line-height:1}
.pl-mc b{font-weight:400;font-size:20px}

.pl-mc u{position:absolute;right:1px;top:0;text-decoration:none;font-size:11px}
.pl-mc.lanz{background:var(--cl);box-shadow:0 0 0 2px #000 inset,0 0 0 4px var(--cl) inset}
.pl-mc.past{opacity:.45}

.pl-mc.on::after{content:'✓';position:absolute;left:3px;top:1px;font-family:'Press Start 2P',monospace;font-size:8px;color:#7fff5f}
.pl-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mut);margin-bottom:14px}
.pl-leg i{display:inline-block;width:11px;height:11px;background:var(--c);border:2px solid #000;margin-right:4px;vertical-align:-1px}
.pl-cw{margin-bottom:12px}
.pl-day{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid #000;padding:8px 10px;margin-bottom:5px;transition:background .2s}
.pl-day.lanz{background:#fff3c4;border-width:3px;box-shadow:3px 3px 0 #000}
.pl-day.today{box-shadow:0 0 0 3px #c2416e}
.pl-day.past:not(.on){opacity:.55}
.pl-day.on{background:#eefbe6}
.pl-day.on .pl-db{color:#6c7a66}
.pl-day.flash{background:#ffe7bf}
.pl-chk{flex:none;width:26px;height:26px;margin-top:2px;background:#fff;border:3px solid #000;cursor:pointer;position:relative;padding:0;font-size:16px;line-height:1}
.pl-chk[aria-pressed=true]{background:#7fff5f}
.pl-chk[aria-pressed=true]::after{content:'';position:absolute;left:6px;top:1px;width:7px;height:12px;border:solid #000;border-width:0 3px 3px 0;transform:rotate(45deg)}
.pl-dn{flex:none;width:34px;text-align:center;line-height:1}
.pl-dn .ps{font-size:6.5px;color:var(--mut) !important}
.pl-dn b{display:block;font-family:'VT323',monospace;font-weight:400;font-size:28px}
.pl-db{flex:1;min-width:0}
.pl-dh{font-weight:700;font-size:14px;margin-bottom:3px}
.pl-lz,.pl-hoy,.pl-ya{text-transform:none;font-family:'Press Start 2P',monospace;font-weight:400;font-size:7px;padding:3px 5px;border:2px solid #000;margin-left:4px;vertical-align:1px;white-space:nowrap}
.pl-lz{background:var(--cl)}
.pl-hoy{background:#c2416e;color:#fff}
.pl-ya{background:#e9e1d3;color:#5b5060}
.pl-ln{display:flex;gap:7px;align-items:flex-start;font-size:14px;line-height:1.38;margin-top:3px}
.pl-dot{flex:none;width:12px;height:12px;margin-top:4px;background:var(--c);border:2px solid #000}
.pl-ic{flex:none;width:16px;font-style:normal;font-size:13px;text-align:center;margin-top:1px}
.pl-rest{color:var(--mut)}
.pl-rec-day{background:#f1e6ff;margin:5px -4px 0;padding:4px}

/* historias */
.pl-ings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.pl-ing{background:#fff;border:2px solid #000;box-shadow:3px 3px 0 #000;padding:10px}
.pl-ingi{font-size:18px;margin-right:4px}
.pl-ing b{font-family:'Press Start 2P',monospace;font-weight:400;font-size:9.5px}
.pl-ing small{display:block;font-size:13px;color:var(--mut);margin:5px 0 4px;line-height:1.3}
.pl-ing p{font-size:14px;line-height:1.35}
.pl-piso{background:var(--cream2);border:2px solid #000;padding:9px 11px;font-size:14.5px}

/* ajustes */
.pl-adj{display:flex;flex-direction:column;gap:10px}
.pl-ab{background:#fff;border:2px solid #000;padding:10px 12px}
.pl-ab > .ps{display:block;color:var(--mut) !important;font-size:7.5px;margin-bottom:6px}
.pl-mm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pl-mm b{display:inline-block;font-size:13px;text-transform:uppercase;letter-spacing:.04em;border-bottom:3px solid var(--cv);margin-bottom:4px}
.pl-mm > div + div b{border-color:var(--cc)}
.pl-ab ul{margin:0;padding-left:18px;font-size:14.5px}
.pl-ab li{margin-bottom:3px}
.pl-ab p{font-size:14.5px}

/* medir */
.pl-med{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.pl-med > div{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid #000;padding:9px 11px}
.pl-mn{flex:none;width:30px;height:30px;background:var(--c);border:2px solid #000;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-weight:400;font-size:11px}
.pl-med p{font-size:14.5px}
.pl-train{background:#1b1320;color:#fff;border:2px solid #000;box-shadow:3px 3px 0 #c2416e;padding:10px 12px;font-size:14.5px}
.pl-train b{color:#ffd54a}
.pl-foot{padding:12px 18px 16px;font-size:13.5px;color:var(--mut);text-align:center;border-top:3px dashed #e3d4bb}

/* ── 3) cierre ── */
.pl-cb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pl-big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;color:#000;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:12px 14px;font-family:'Barlow',sans-serif;font-weight:700;font-size:16px;line-height:1.25;text-decoration:none;cursor:pointer}
.pl-big span{font-size:20px;line-height:1;margin-bottom:4px}
.pl-big small{font-weight:500;font-size:13px;color:#4b4250}
.pl-big:hover{background:#fff1d6}
.pl-b-pdf{background:var(--cl)}
.pl-b-pdf:hover{background:#ffe27a}
.pl-b-wsp{background:#7fff5f}
.pl-b-wsp:hover{background:#a6ff8c}

/* ── celular ── */
@media (max-width:640px){
  .pl-card{padding:14px}

}
@media (max-width:380px){ .pl-ings{grid-template-columns:1fr} }

/* ── imprimir (planPrintHTML dentro de #printArea) ── */
@media print{
  @page{size:A4;margin:12mm}

}
.pl-sigue{margin-top:12px;display:grid;gap:8px}

  .semana .sem-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 10px}

<script>
// Noche en pixel art: se dibuja chiquito (200×125) y se agranda sin suavizar.
// Cielo azul noche/índigo → azul petróleo en el horizonte, estrellas (algunas con brillo en cruz),
// luna llena con cráteres y halo tramado, nubes finitas iluminadas por la luna, sierra de Mallorca
// en silueta con las luces de un pueblo en la costa, y el mar oscuro con el reflejo de la luna.
// (El archivo se sigue llamando sunset.js para no romper el build.)
// Lo importante (luna + horizonte) va centrado y en la mitad de abajo: la imagen se usa con
// "center bottom / cover", así en el celu (vertical) se ve la franja del medio con la luna entera.
(function () {
  const Wd = 200, Hd = 125, HZ = 89, MX = 100, MY = 63, MR = 12;
  const c = document.createElement("canvas");
  c.width = Wd; c.height = Hd;
  const g = c.getContext("2d");
  let seed = 41; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); };

  // ── cielo en franjas limpias, con una fila tramada en cada cambio ──
  const SKY = ["#070b1e","#091026","#0b142e","#0d1936","#0f1e3e","#112445","#132a4c","#153153",
               "#17385a","#194060","#1b4865","#1e5069"];
  const band = HZ / SKY.length;
  const skyAt = y => SKY[Math.min(SKY.length - 1, Math.max(0, Math.floor(y / band)))];
  for (let y = 0; y < HZ; y++) {
    const i = Math.min(SKY.length - 1, Math.floor(y / band));
    const edge = i > 0 && y === Math.floor(i * band);
    for (let x = 0; x < Wd; x++) px(x, y, edge && (x + y) % 2 ? SKY[i - 1] : SKY[i]);
  }
  // halo de la luna: dos anillos tramados un poco más claros
  for (let y = MY - MR - 14; y < Math.min(HZ, MY + MR + 14); y++) for (let x = MX - MR - 14; x <= MX + MR + 14; x++) {
    const d = Math.hypot(x + 0.5 - MX, y + 0.5 - MY);
    if (d < MR + 5 && d >= MR) px(x, y, mix(skyAt(y), "#9fc2d8", 0.22));
    else if (d < MR + 12 && d >= MR + 5 && (x + y) % 2) px(x, y, mix(skyAt(y), "#9fc2d8", 0.13));
  }
  // estrellas (las de cruz van debajo de la fila 14, así no se meten en el encabezado): puntitos, algunas más brillantes y unas pocas con brillo en cruz
  const STAR = ["#5c6f9a","#8fa3cc","#c9d6f0","#ffffff"];
  for (let k = 0; k < 120; k++) {
    const x = Math.floor(rnd() * Wd), y = Math.floor(Math.pow(rnd(), 1.4) * (HZ - 12));
    if (Math.hypot(x - MX, y - MY) < MR + 13) continue;
    const t = rnd();
    px(x, y, STAR[t < 0.45 ? 0 : t < 0.8 ? 1 : t < 0.95 ? 2 : 3]);
  }
  const cross = (x, y, big) => {
    px(x, y, "#ffffff");
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a, b]) => { px(x + a, y + b, "#c9d6f0"); if (big) px(x + 2 * a, y + 2 * b, "#5c6f9a"); });
  };
  [[22,18,1],[63,22,0],[141,16,1],[178,32,0],[34,44,0],[160,55,1],[88,26,0],[118,20,0],[8,60,0],[190,20,0]].forEach(s => cross(s[0], s[1], s[2]));

  // ── nubes finitas, iluminadas por la luna (gris azulado) ──
  function cloudBank(cx, base, w, h, n, z) {
    const B = [];
    for (let k = 0; k < n; k++) {
      const t = (k + 0.5) / n, prof = Math.sin(t * Math.PI);
      const x = cx - w / 2 + t * w + (rnd() - 0.5) * 4;
      const r = Math.max(2.2, h * (0.45 + 0.4 * prof) + rnd() * 1.2);
      const y = base - r * 0.55 * prof - (rnd() - 0.2) * 1.6;
      B.push({ x, y, r, z: z + rnd(), base });
    }
    return B;
  }
  const CL = ["#0f1a35","#16244a","#22335c","#34496f","#4f6686","#7a90aa"];
  const B = [].concat(
    cloudBank(40, 36, 58, 4.5, 9, 1),
    cloudBank(166, 26, 48, 4, 8, 1),
    cloudBank(150, 60, 56, 4, 9, 2),
    cloudBank(40, 70, 40, 3, 7, 2),
    cloudBank(84, 50, 22, 2.4, 4, 3)
  );
  for (let y = 0; y < HZ; y++) for (let x = 0; x < Wd; x++) {
    let f = null, behind = false;
    for (const b of B) {
      if (y > b.base + 1) continue;
      const d = Math.hypot(x + 0.5 - b.x, (y + 0.5 - b.y) * 1.1);
      if (d <= b.r) { if (!f || b.z > f.z) { if (f) behind = true; f = b; } else behind = true; }
    }
    if (!f) continue;
    const nx = (x + 0.5 - f.x) / f.r, ny = (y + 0.5 - f.y) * 1.1 / f.r;
    // la luz viene de la luna: el borde que mira hacia ella brilla más
    const lx = MX - f.x, ly = MY - f.y;
    const L = -0.3 + 0.95 * ny * Math.sign(ly) + 0.2 * nx * Math.sign(lx) + (Math.hypot(x - MX, y - MY) < 45 ? 0.2 : 0);
    let k = L > 0.55 ? 5 : L > 0.25 ? 4 : L > -0.05 ? 3 : L > -0.4 ? 2 : L > -0.75 ? 1 : 0;
    if (behind && Math.hypot(nx, ny) > 0.9 && ny < 0) k = Math.max(0, k - 1);
    px(x, y, CL[k]);
  }

  // ── luna llena con cráteres suaves y borde sombreado ──
  for (let y = MY - MR; y <= MY + MR; y++) for (let x = MX - MR; x <= MX + MR; x++) {
    const dx = x + 0.5 - MX, dy = y + 0.5 - MY, d = Math.hypot(dx, dy);
    if (d > MR) continue;
    let col = "#f4f1e0";
    if (d > MR - 1.2 && dx + dy > 2) col = "#c9cbc2";         // sombra abajo a la derecha
    else if (dx + dy > MR * 0.9) col = "#e2e0cf";
    else if (d > MR - 1.2) col = "#ffffff";                  // borde iluminado arriba a la izquierda
    px(x, y, col);
  }
  // cráteres (manchas tramadas + sombra)
  [[-4,-3,2.6],[3,-5,1.6],[4,2,3],[-3,5,1.8],[-7,2,1.2],[7,-1,1.1]].forEach(([cx, cy, r]) => {
    for (let y = Math.floor(MY + cy - r); y <= MY + cy + r; y++) for (let x = Math.floor(MX + cx - r); x <= MX + cx + r; x++) {
      const d = Math.hypot(x + 0.5 - MX - cx, y + 0.5 - MY - cy);
      if (d <= r && Math.hypot(x + 0.5 - MX, y + 0.5 - MY) < MR - 0.6) px(x, y, d > r - 1 && (x - MX - cx) < 0 ? "#c2c3b8" : "#d8d7c6");
    }
  });

  // ── sierra de Mallorca en silueta, a los costados (el medio queda libre para la luna) ──
  const ridge = (x0, x1, peak, hgt, jag, P) => {
    for (let x = x0; x < x1; x++) {
      const t = (x - x0) / (x1 - x0);
      const shape0 = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, (t - peak + 0.5)))), 1.4);
      if (shape0 < 0.08) continue;
      const h = Math.round(hgt * shape0 + jag * (Math.sin(x * 0.9) + 0.6 * Math.sin(x * 2.3 + 1)));
      for (let y = HZ - h; y < HZ; y++) {
        const rim = y === HZ - h;
        px(x, y, rim ? P[0] : y < HZ - h + 3 && (x + y) % 2 ? P[1] : P[2]);
      }
    }
  };
  const FAR = ["#2c4560","#14223a","#111d33"], NEAR = ["#1d2d45","#0b1426","#08101f"];
  ridge(-10, 74, 0.35, 19, 0.8, FAR);
  ridge(-4, 40, 0.6, 9, 0.5, NEAR);
  ridge(128, 214, 0.62, 16, 0.8, FAR);
  ridge(176, 206, 0.4, 7, 0.4, NEAR);
  // pueblo en la costa: lucecitas amarillas al pie de la sierra
  [[44,87],[47,86],[50,87],[53,85],[55,87],[58,86],[62,87],[66,86],[30,86],[34,87],
   [140,87],[143,86],[147,87],[151,85],[154,87],[158,86],[170,87]].forEach(([x, y], i) => px(x, y, i % 3 ? "#ffd86b" : "#ffb347"));

  // ── mar oscuro en franjas, con brillos y el reflejo de la luna cortado ──
  const SEA = ["#1a4660","#163c55","#13334b","#102a41","#0d2237","#0b1b2e","#091526","#07101f"];
  const sband = (Hd - HZ) / SEA.length;
  for (let y = HZ; y < Hd; y++) {
    const i = Math.min(SEA.length - 1, Math.floor((y - HZ) / sband));
    const edge = i > 0 && y === HZ + Math.floor(i * sband);
    for (let x = 0; x < Wd; x++) px(x, y, edge && (x + y) % 2 ? SEA[i - 1] : SEA[i]);
  }
  g.fillStyle = "#2f6380"; g.fillRect(0, HZ, Wd, 1); // línea del horizonte
  // reflejos de las luces del pueblo
  [[47,90],[53,91],[58,90],[147,90],[151,91],[156,90]].forEach(([x, y]) => { g.fillStyle = "#8a7a46"; g.fillRect(x, y, 2, 1); });
  // reflejo de la luna: franjas horizontales centradas que se angostan y se cortan
  for (let y = HZ + 1; y < Hd; y++) {
    if ((y - HZ) % 2 === 0) continue;
    const t = (y - HZ) / (Hd - HZ);
    const half = Math.round(MR * (0.8 + 0.5 * t) + (rnd() - 0.5) * 4);
    const col = t < 0.25 ? "#e8ecdc" : t < 0.5 ? "#b9c8cf" : t < 0.75 ? "#7f9aae" : "#4e6a86";
    let x = MX - half;
    while (x < MX + half) {
      const seg = 2 + Math.floor(rnd() * (6 - 3 * t)), skip = 1 + Math.floor(rnd() * (2 + 4 * t));
      g.fillStyle = col; g.fillRect(x, y, Math.min(seg, MX + half - x), 1);
      x += seg + skip;
    }
  }
  // brillitos sueltos en el mar
  for (let k = 0; k < 36; k++) {
    const y = HZ + 3 + Math.floor(rnd() * (Hd - HZ - 4)), x = Math.floor(rnd() * Wd);
    if (Math.abs(x - MX) < MR * 1.4 + 3) continue;
    const t = (y - HZ) / (Hd - HZ);
    g.fillStyle = t < 0.4 ? "#3a6d88" : "#1f3d58"; g.fillRect(x, y, 2 + Math.floor(rnd() * 4), 1);
  }

  try { document.documentElement.style.setProperty("--sky", "url(" + c.toDataURL("image/png") + ")"); } catch (e) {}
})();

/* ── utilidades ── */
function pxCat(){ return (typeof CATALOGO !== 'undefined' && Array.isArray(CATALOGO)) ? CATALOGO : []; }
function pxArr(id){ const v = S[id]; return Array.isArray(v) ? v.filter(Boolean) : (v ? [String(v)] : []); }

function pxHoy(){ if(typeof PLAN_HOY === 'string' && pxParse(PLAN_HOY)) return pxParse(PLAN_HOY); const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function pxParse(s){ const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }

/* reemplaza {nombre} {tema} {frase} {historia} {lugar} {fecha} {cuando}; raw=true → texto plano */
function pxFill(str, e, raw, ctx){
  const E = raw ? (x => String(x == null ? '' : x)) : esc;
  const lug = pxLugarDe(e);
  const M = pxFecha();
  const c = ctx || {};
  const rep = {
    nombre: pxNombre() || 'tu nombre de artista',
    tema: pxTema() ? (raw ? pxTema() : pxTema()) : 'tu tema',
    frase: val('r_frase') || 'la frase más fuerte de tu letra',

    lugar: lug,
    fecha: pxFL(M.launch),
    cuando: c.post ? 'ya salió' : 'sale el ' + pxFL(M.launch)
  };
  let s = E(str || '');
  Object.keys(rep).forEach(k => { s = s.split('{' + k + '}').join(E(rep[k])); });
  s = s.split('[fecha]').join(E(rep.fecha));
  return s;
}
function pxLugarDe(e){
  const mine = pxArr('r_lugar'), el = (e && e.lugar) || [];
  const hit = el.filter(l => mine.indexOf(l) >= 0)[0] || mine[0] || el[0];
  return hit ? (PX_LUGAR[hit] || hit.toLowerCase()) : 'tu cuarto';
}

/* ════════ RECOMENDADOR ════════ */
function pxScore(e, relax, keepMat){
  const cn = PX_CN[e.cara] == null ? 0 : PX_CN[e.cara];
  if(cn > pxCara()) return null;                       // nunca se relaja
  if(e.toca && !pxToca()) return null;                 // nunca se relaja
  const mats = pxMats(), lug = pxArr('r_lugar'), moo = pxArr('r_mood');
  const em = e.material || [], el = e.lugar || [], eo = e.mood || [];
  const okMat = !em.length || em.some(m => mats.indexOf(m) >= 0);
  const hitLug = el.length > 0 && el.some(m => lug.indexOf(m) >= 0);
  const hitMood = eo.length > 0 && eo.some(m => moo.indexOf(m) >= 0);
  const okLug = !el.length || !lug.length || hitLug;
  const okMood = !eo.length || !moo.length || hitMood;
  if(!okMat && (relax < 1 || keepMat)) return null;
  if(!okLug && relax < 2) return null;
  if(!okMood && relax < 3) return null;
  const h = pxHoras(), dif = e.dificultad || 2;
  let s = 0;
  if(e.tipo === 'viral') s += 2;
  if(hitLug) s += 2; else if(!el.length) s += .6;
  if(hitMood) s += 2.2; else if(!eo.length) s += .5;
  if(em.length && okMat) s += 1;
  if(e.toca && pxToca()) s += 1.5;
  if(cn === pxCara()) s += .5;
  if(!okMat) s -= 3; if(!okLug) s -= 1; if(!okMood) s -= 1;
  s -= (dif - 1) * (h === 2 ? 1.6 : h === 4 ? .6 : .1);
  s -= (e.minutos || 30) / 300;
  return {e, s, hitLug, hitMood, okMat};
}
function pxRank(pool, n, keepMat){
  let out = [];
  for(let relax = 0; relax <= 3; relax++){
    const seen = {};
    out = pool.map(e => pxScore(e, relax, keepMat)).filter(Boolean)
      .sort((a, b) => b.s - a.s)
      .filter(r => { const k = r.e.id; if(seen[k]) return false; seen[k] = 1; return true; });
    if(out.length >= n) break;
  }
  return out.slice(0, n);
}
function recomendarVirales(/* S */){
  const pool = pxCat().filter(e => e.tipo === 'viral' || e.tambienViral);
  let top = pxRank(pool, 3);
  // si ya eligió uno que sigue siendo válido (cara/toca), que no desaparezca
  const ch = S.plan_viral && pool.filter(e => e.id === S.plan_viral)[0];
  if(ch && !top.some(r => r.e.id === ch.id)){ const r = pxScore(ch, 3); if(r){ top = top.slice(0, 2).concat([r]); } }
  if(!top.length) top = [{e:PX_GEN.viral, s:0, hitLug:false, hitMood:false, okMat:true}];
  // etiquetas
  const used = {};
  const easiest = top.slice().sort((a, b) => ((a.e.dificultad||2) - (b.e.dificultad||2)) || ((a.e.minutos||30) - (b.e.minutos||30)))[0];
  top.forEach(r => { r.tag = ''; });
  easiest.tag = 'Más fácil para vos'; used.f = 1;
  top.forEach(r => { if(!r.tag && r.hitMood && !used.m){ r.tag = 'Coincide con tu mood'; used.m = 1; } });
  top.forEach(r => { if(!r.tag && r.hitLug && !used.l){ r.tag = 'Va con ' + pxLugarDe(r.e); used.l = 1; } });
  top.forEach(r => { if(!r.tag && r.hitMood){ r.tag = 'Coincide con tu mood'; } });
  top.forEach((r, i) => { if(!r.tag) r.tag = i === 0 ? 'El que más te conviene' : 'Buena alternativa'; });
  return top;
}
function pxPick(tipo, n, excl){
  const ex = excl || [];
  const pool = pxCat().filter(e => e.tipo === tipo && ex.indexOf(e.id) < 0);
  const r = pxRank(pool, n, true).map(x => x.e);
  if(r.length < n && PX_GEN[tipo]) r.push(PX_GEN[tipo]);
  return r;
}

/* ════════ MODELO DEL PLAN (fechas, reels, días) ════════ */
function pxFecha(){
  const hoy = pxHoy();
  const avisos = [];
  let launch = pxParse(S.p_fecha), ejemplo = false; const sinFecha = !launch;
  if(launch && pxDiff(hoy, pxAdd(launch, 7)) < 0){
    avisos.push({k:'pasada', t:'La fecha que pusiste (' + pxFL(launch) + ') ya pasó. Te armé el plan con una fecha de ejemplo: cambiala arriba y se actualiza.'});
    launch = null;
  }
  if(!launch){
    ejemplo = true;
    launch = pxAdd(hoy, 14); while(launch.getDay() !== 5) launch = pxAdd(launch, 1);
    if(sinFecha) avisos.push({k:'sinfecha', t:'Todavía no elegiste fecha, así que usé de ejemplo el ' + pxFL(launch) + '. Elegí la tuya y el calendario se acomoda solo.'});
  }
  if(!ejemplo && launch.getDay() !== 5){
    let a = launch, b = launch; while(a.getDay() !== 5) a = pxAdd(a, -1); while(b.getDay() !== 5) b = pxAdd(b, 1);
    avisos.push({k:'noviernes', t:'Tu fecha cae ' + PX_DIAS[launch.getDay()] + '. Los temas salen los viernes porque ese día se renuevan las playlists. Si podés, pasala al viernes ' + pxF(a) + ' o al ' + pxF(b) + '. Igual el plan funciona con tu fecha.'});
  }
  const day1 = pxAdd(launch, -13);
  const faltan = pxDiff(hoy, launch);
  const hoyN = pxDiff(day1, hoy) + 1;   // número de día que es hoy (puede ser <1 o >21)
  if(!ejemplo && hoyN > 1 && hoyN <= 14) avisos.push({k:'tarde', t:'Faltan ' + faltan + ' días: el plan ya arrancó. No pasa nada, empezás hoy por el Día ' + hoyN + '. Los días anteriores quedan marcados como «ya pasó».'});
  if(!ejemplo && hoyN > 14 && hoyN <= 21) avisos.push({k:'post', t:'Tu tema ya salió. Seguí con la semana 3 desde hoy (Día ' + hoyN + '): ahora toca empujarlo.'});
  return {hoy, launch, ejemplo, day1, faltan, hoyN, avisos};
}
function pxModelo(){
  const F = pxFecha(), hoy = F.hoy, launch = F.launch, ejemplo = F.ejemplo, day1 = F.day1, faltan = F.faltan, hoyN = F.hoyN, avisos = F.avisos;

  // virales elegidos
  const recs = recomendarVirales(S);
  const vir = recs.map(r => r.e);
  let elegido = vir.filter(e => e.id === S.plan_viral)[0];
  if(!elegido){ elegido = vir[0]; if(S.plan_viral !== elegido.id && pxCat().length){ S.plan_viral = elegido.id; try { save(); } catch(err){} } }
  const virOrden = [elegido].concat(vir.filter(e => e !== elegido));
  const vids = vir.map(e => e.id), con = pxPick('conexion', 3, vids), conv = pxPick('conversion', 3, vids);

  // días con historias
  const hd = val('h_dias');
  const sdows = /Todos/i.test(hd) ? [0,1,2,3,4,5,6] : /^5/.test(hd) ? [1,2,3,5,6] : [1,3,5,6];
  let tdia = PX_DIAS.indexOf((val('t_dia') || 'domingo').toLowerCase()); if(tdia < 0) tdia = 0;

  const dias = [], reels = [];
  let ingI = 0, cntV = 0, cntC = 0, cntK = 0;
  for(let n = 1; n <= 21; n++){
    const d = pxAdd(day1, n - 1), dow = d.getDay(), w = Math.floor((n - 1) / 7);
    const D = {n, d, dow, w, past: !ejemplo && pxDiff(d, hoy) > 0, hoy: !ejemplo && pxDiff(d, hoy) === 0, lanz: n === 14};
    let tipo = dow === 1 ? 'viral' : dow === 3 ? 'conexion' : dow === 5 ? 'conversion' : null;
    if(n === 14) tipo = 'lanz';
    if(tipo){
      let e;
      if(tipo === 'viral') e = virOrden[(cntV++) % virOrden.length];
      else if(tipo === 'conexion') e = con[(cntC++) % con.length];
      else if(tipo === 'conversion'){
        const pool = n > 14 ? conv.filter(x => PX_SOLO_PRE.indexOf(x.id) < 0) : conv;
        const list = pool.length ? pool : [PX_GEN.conversion];
        e = list[(cntK++) % list.length];
      }
      else e = PX_GEN.lanz;
      const R = {n, d, w, tipo, e, post: n > 14};
      D.reel = R; reels.push(R);
    }
    if(sdows.indexOf(dow) >= 0 || n === 13 || n === 14 || n === 15){
      let ing;
      if(n === 14 || n === 13) ing = 'Recordá';
      else { ing = ['Mostrate','Preguntá','Regalá','Recordá'][ingI % 4]; ingI++; }
      D.hist = {ing, k: n};
    }
    if(dow === tdia) D.graba = true;
    dias.push(D);
  }
  // qué graba cada bloque: los próximos 3 reels desde ese día
  const firstRec = dias.filter(x => x.graba)[0];
  if(reels.length && (!firstRec || reels[0].n < firstRec.n)) dias[0].graba = dias[0].graba || 'arranque';
  dias.forEach(D => {
    if(!D.graba) return;
    const nxt = reels.filter(r => r.n >= D.n), stop = dias.filter(x => x.graba && x.n > D.n)[0];
    D.grabaReels = nxt.filter(r => !stop || r.n < stop.n).slice(0, 4);
    if(!D.grabaReels.length) D.graba = false;
  });
  return {hoy, launch, ejemplo, day1, faltan, hoyN, avisos, recs, vir, elegido, virOrden, con, conv, dias, reels, sdows, tdia};
}

      mo.indexOf('El proceso') >= 0 ? ['10 segundos grabando o escribiendo ' + tema + '.'] : [],
      mo.indexOf('Mi día a día') >= 0 ? ['Un momento de tu día (el mate, el bondi, el laburo) con un texto corto.'] : [],
      mo.indexOf('Mis amigos / equipo') >= 0 ? ['Presentá a alguien que te ayuda con ' + tema + '.'] : [],
      mo.indexOf('Lo que escucho') >= 0 ? ['El tema que tenés en loop hoy y por qué te gusta.'] : [],
      ['Dónde estás ahora y qué estás haciendo para ' + tema + '.']),
    'Preguntá': [].concat(
      mo.indexOf('Encuestas y preguntas') >= 0 ? ['Encuesta: «¿Cuál de estas 2 portadas te gusta más?»'] : [],
      ['Encuesta: «¿Te pasó lo que cuento en ' + tema + '?» Sí / Me está pasando.', 'Caja de preguntas: «¿Qué querés saber de la canción?»']),
    'Regalá': ['Un pedacito de ' + tema + ' que nadie escuchó (15 seg).', 'La letra escrita a mano, con la frase que más te gusta.', 'Una toma que salió mal: la gente ama los errores.'],
    'Recordá': post ? ['«Ya salió ' + tema + '» + link + reposteá a quien la comparta.'] : [(n && n < 14 ? 'Cuenta regresiva: «Faltan ' + (14 - n) + ' días» + sticker de recordatorio.' : 'Cuenta regresiva: «Faltan X días» + sticker de recordatorio.'), 'Link de pre-save en un sticker: «guardala así te llega el día que sale».']
  };
  if(ing === 'Recordá' && k === 14) return '¡SALE HOY! Sticker con link a ' + tema + ', y compartí cada historia donde te etiqueten.';
  if(ing === 'Recordá' && k === 13) return '«Mañana sale ' + tema + '» + sticker de cuenta regresiva para el ' + E(pxFL(M.launch)) + '.';
  const arr = L[ing] || ['']; return arr[k % arr.length];
}

function planRefresh(){
  document.querySelectorAll('[data-plan]').forEach(el => { el.innerHTML = pxPlanInner(false); });
  const id = S.plan_viral;
  document.querySelectorAll('[data-plan-virales] .pl-vopt').forEach(o => {

    o.classList.toggle('sel', sel);
    const b = o.querySelector('.pl-pick'); if(b) b.textContent = sel ? '✓ Elegido' : 'Elijo este';
  });
  document.querySelectorAll('[data-pxwsp]').forEach(a => { a.href = pxWspURL(); });
}
function pxSetDay(n){
  const o = S.plan_hecho || {}; o[n] = !o[n]; if(!o[n]) delete o[n]; S.plan_hecho = o; save();
  document.querySelectorAll('[data-pxday="' + n + '"]').forEach(el => el.classList.toggle('on', !!o[n]));
  document.querySelectorAll('[data-pxd="' + n + '"]').forEach(b => b.setAttribute('aria-pressed', String(!!o[n])));
  const c = pxHechoN();
  document.querySelectorAll('[data-pxprog]').forEach(b => { b.style.width = Math.round(c / 21 * 100) + '%'; });
  document.querySelectorAll('[data-pxprogt]').forEach(b => { b.textContent = c + ' de 21 días hechos'; });
  document.querySelectorAll('[data-pxprogn]').forEach(b => { b.textContent = c + ' / 21'; });
  if(c === 21) toast('¡21 de 21! Sos una máquina 🏆');
  else if(o[n] && n === 14) toast('¡Salió! 🎉');
}
function pxCopy(btn){
  const p = btn.parentNode.querySelector('.pl-copytxt'); const t = p ? p.textContent : '';
  const ok = () => { toast('Copiado ✓'); btn.textContent = '✓ Copiado'; setTimeout(() => { btn.textContent = 'Copiar'; }, 1400); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok).catch(() => toast('No se pudo copiar: seleccioná el texto'));
  else { try { const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); ok(); } catch(e){ toast('Seleccioná el texto y copialo'); } }
}
function pxPrint(){
  const pa = document.getElementById('printArea');
  if(pa){ pa.innerHTML = planPrintHTML(); setTimeout(() => window.print(), 60); }
  else window.print();
}
let PX_BOUND = false;
function planBind(/* root */){
  if(PX_BOUND) return; PX_BOUND = true;   // delegado en document: sirve para todo lo que se inserte después
  document.addEventListener('click', ev => {
    const t = ev.target.closest && ev.target.closest('[data-pxv],[data-pxd],[data-pxc],[data-pxprint],[data-pxwsp],.pl-mc');
    if(!t) return;
    if(t.hasAttribute('data-pxv')){ S.plan_viral = t.getAttribute('data-pxv'); save(); planRefresh(); toast('Listo: ese es tu viral ✓'); return; }
    if(t.hasAttribute('data-pxd')){ pxSetDay(+t.getAttribute('data-pxd')); return; }
    if(t.classList.contains('pl-mc')){ const n = t.getAttribute('data-pxday'); const row = t.closest('[data-plan]') && t.closest('[data-plan]').querySelector('.pl-day[data-pxday="' + n + '"]'); if(row){ row.scrollIntoView({behavior:'smooth', block:'center'}); row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 900); } return; }
    if(t.hasAttribute('data-pxc')){ pxCopy(t); return; }
    if(t.hasAttribute('data-pxprint')){ pxPrint(); return; }
    if(t.hasAttribute('data-pxwsp')){ t.href = pxWspURL(); return; }   // deja seguir el link
  });
  // los iframes de los reels se cargan recién al desplegar
  document.addEventListener('toggle', ev => {
    const d = ev.target; if(!d.classList || !d.classList.contains('pl-reel') || !d.open) return;
    d.querySelectorAll('iframe[data-src]').forEach(f => { f.src = f.getAttribute('data-src'); f.removeAttribute('data-src'); });
  }, true);
}

/* **…** = negrita (lo más importante) · __…__ = subrayado fino (lo secundario) */
function fmt(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>'); }

  const v = S[f.id];

  if(Array.isArray(v)) return v.length>0;
  return !!(v && String(v).trim());
}

   EL GUION DEL CHAT — se arma solo a partir de STEPS
   say = Larry habla · ask = pregunta · card = tarjeta · chapter = animación de parada
   go = botón para seguir · send = envío final
   ════════════════════════════════════════════════════════════════════ */
function buildScript(){
  const B = [];
  GUIDE_COVER.lines.forEach(t=>B.push({k:'say', t}));
  B.push({k:'go', label:'¡Arrancamos! →'});
  STEPS.forEach((st, si)=>{
    B.push({k:'chapter', st, si});
    st.guide.lines.forEach(t=>B.push({k:'say', t}));
    if(st.visual) B.push({k:'card', card:st.visual});
    if(st.deep) B.push({k:'card', card:'deep', st});
    let prevG = null;
    st.fields.forEach(f=>{
      const grp = f.group && f.group!==prevG ? f.group : null; prevG = f.group || prevG;
      if(f.kind==='yesno'){
        B.push({k:'say', html:()=>'<p class="vt">'+esc(f.label)+'</p>'+(f.hint?'<p class="hint">'+fmt(f.hint)+'</p>':'')});
        f.items.forEach((it,k)=>B.push({k:'ask', f, sub:k}));
      } else B.push({k:'ask', f, grp});
      (AFTER[f.id]||[]).forEach(c=>B.push(c));
    });
    if(st.done) B.push({k:'card', card:'done', st});
    B.push({k:'go', label: si<STEPS.length-1 ? 'Siguiente parada: '+STEPS[si+1].t+' →' : 'Armar mi plan ★'});
  });
  B.push({k:'chapter', final:true});
  GUIDE_FINAL.lines.forEach(t=>B.push({k:'say', t}));
  B.push({k:'card', card:'virales'});
  B.push({k:'go', label:'Ya elegí mi viral →'});
  B.push({k:'say', t:'**Antes de ver tu plan,** pegame **el link de tu carpeta de Drive** __que te mandé por WhatsApp.__'});
  B.push({k:'say', html:()=>'<p class="vt">Ahí te subo <b>tu plan completo,</b> día por día, para que lo tengas siempre a mano.</p><p class="hint">Abrí la carpeta desde el link de WhatsApp → tocá <b>⋮</b> o <b>Compartir</b> → <b>Copiar enlace</b> → pegalo acá abajo.</p>'});
  B.push({k:'send'});
  B.push({k:'go', label:'Ver mi plan ★'});
  B.push({k:'card', card:'plan'});
  B.push({k:'card', card:'cierre'});
  return B;
}

/* ── el motor ── */
let RUN = 0;
async function stepFrom(i){
  const my = ++RUN; closeInput();
  while(i < SCRIPT.length){
    const b = SCRIPT[i];
    if(b.k==='go'){ pos = i; savePos(); openInput(i); return; }
    if(b.k==='chapter'){ await wait(250); if(my!==RUN) return; larryPart(b, true); toBottom(); pos = ++i; savePos(); await wait(950); if(my!==RUN) return; continue; }
    await typing(b.k==='card' ? 550 : (b.k==='send' ? 0 : durOf(b))); if(my!==RUN) return;
    if(b.k==='send'){ pos = i; savePos(); openInput(i); return; }
    larryPart(b, true); toBottom();
    if(b.k==='ask'){ pos = i; savePos(); openInput(i); return; }
    pos = ++i; savePos(); await wait(260); if(my!==RUN) return;
  }
  pos = SCRIPT.length; savePos(); openInput(-1);
}
function finish(i, fn){
  closeInput(); fn(); toBottom();
  pos = i+1; savePos(); setTimeout(()=>stepFrom(i+1), 320);
}
