  const skip = ()=>finish(i, ()=>userAns(f));
  const nose = (pre)=>()=>finish(i, ()=>{ if(pre) pre(); S[f.id] = (f.kind==='chips'||f.kind==='traps') ? [NS] : NS; if(f.kind==='traps') S[f.id+'_none']=false; save(); refreshLive(); userAns(f); });
  if(f.kind==='text' || f.kind==='suggest' || f.kind==='area'){
    if(f.kind==='suggest') f.chips.forEach(c=>qb(c, 'chip', ()=>{ const cur=cin.value.trim(); cin.value = cur ? (cur.includes(c)?cur:cur+' + '+c) : c+' '; grow(); cin.focus(); }));
    if(f.tpl) qb('✨ Armar borrador con mis respuestas', 'chip', ()=>{ cin.value = spotifyDraft(); grow(); cin.focus(); toast('Borrador listo: cambialo a tu manera'); });
    if(f.opt) qb('Saltar →', 'ghost', skip);
    qb('🤷 '+NS, 'ghost', nose());
    openComposer(f.ph || (f.kind==='area' ? 'Escribí como te salga…' : 'Escribí acá…'), S[f.id], ()=>{
      const v = cin.value.trim(); if(!v){ toast(f.opt ? 'Escribí algo o tocá Saltar' : 'Escribí tu respuesta (mirá el ejemplo de Santi)'); return; }
      finish(i, ()=>{ S[f.id]=v; save(); refreshLive(); userAns(f); });
    });
    return;
  }
  if(f.kind==='date'){
    const w = row('l', '<div class="mcard"><div class="wfield" data-field="'+f.id+'">'+inputHTML(f)+'</div><div class="wfoot"><button class="btnp" type="button">Listo ✓</button></div></div>', 'wide');
    toBottom(); hintLine('Elegí la fecha arriba y tocá <b>Listo</b> ↑');
    if(f.opt) qb('Saltar →', 'ghost', ()=>{ w.remove(); skip(); });
    qb('🤷 '+NS, 'ghost', nose(()=>w.remove()));
    w.querySelector('.btnp').onclick = ()=>{ if(!S[f.id] || S[f.id]===NS){ toast('Elegí una fecha, o tocá «Todavía no lo sé»'); return; } finish(i, ()=>{ w.remove(); refreshLive(); userAns(f); }); };
    return;
  }
  if(f.kind==='choice'){
    f.options.forEach(o=>qb(o.v, '', ()=>finish(i, ()=>{ S[f.id]=o.v; save(); refreshLive(); userAns(f); }), o.s));
    if(f.opt) qb('Saltar →', 'ghost', skip);
    qb('🤷 '+NS, 'ghost', nose());
    return;
  }
  // chips · colors · traps → tarjeta para elegir dentro del chat
  const w = row('l', '<div class="mcard"><div class="wfield" data-field="'+f.id+'">'+inputHTML(f)+'</div><div class="wfoot"><button class="btnp" type="button">Listo ✓</button></div></div>', 'wide');
  toBottom();
  hintLine('Elegí arriba y tocá <b style="color:#ffb347">Listo</b> ↑');
  if(f.opt) qb('Saltar →', 'ghost', ()=>{ w.remove(); skip(); });
  qb('🤷 '+NS, 'ghost', nose(()=>w.remove()));
  w.querySelector('.btnp').onclick = ()=>{
    if(f.kind==='chips' && !arr(f.id).length && !f.opt){ toast('Elegí al menos una, o tocá «Todavía no lo sé»'); return; }
    if(f.kind==='traps' && !filled(f)){ toast('Tocá las que te pasan, o «No caigo en ninguna»'); return; }
    if(f.kind==='colors') save();
    finish(i, ()=>{ w.remove(); refreshLive(); userAns(f); });
  };
}
function grow(){ cin.style.height='auto'; cin.style.height = Math.min(cin.scrollHeight+6, 190)+'px'; }
cin.addEventListener('input', grow);
cin.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !TOUCH){ e.preventDefault(); SEND && SEND(); } });
$('#csend').onclick = ()=>{ SEND && SEND(); };

/* ── entradas reutilizables (tarjetas y editar) ── */
function inputHTML(f){
  const v = S[f.id];
  if(f.kind==='text' || f.kind==='suggest') return `<input type="text" data-f="${f.id}" value="${esc(v||'')}" placeholder="${esc(f.ph||'Escribí acá')}">`
      + (f.kind==='suggest' ? `<div class="chips" style="margin-top:10px">${f.chips.map(c=>`<button class="chip" type="button" data-ins="${f.id}" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : '');
  if(f.kind==='date') return `<input type="date" data-f="${f.id}" value="${esc(v&&v!==NS?v:'')}">`;
  if(f.kind==='area') return `<textarea data-f="${f.id}" rows="${f.tall?6:4}" placeholder="${esc(f.ph||'Escribí acá, como te salga')}">${esc(v||'')}</textarea>`;
  if(f.kind==='chips'){
    const sel = v||[]; const custom = sel.filter(x=>!f.chips.includes(x));
    return `<div class="chips">${[...f.chips,...custom].map(c=>`<button type="button" class="chip ${sel.includes(c)?'sel':''}" data-tog="${f.id}" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`
      + `<input type="text" class="other" data-other="${f.id}" placeholder="+ Otra: escribila y tocá Enter" style="margin-top:10px">`
      + (f.max ? `<div class="chips-note">Elegí hasta ${f.max} · ${sel.length}/${f.max}</div>` : '');
  }
  if(f.kind==='choice') return `<div class="choice">${f.options.map(o=>`<button type="button" class="${v===o.v?'sel':''}" data-ch="${f.id}" data-v="${esc(o.v)}" ${f.id==='v_tipo'?`style="${FONTMAP[o.v]}"`:''}>${esc(o.v)}<small style="font-family:Barlow;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px">${esc(o.s||'')}</small></button>`).join('')}</div>`;
  if(f.kind==='colors'){ const names=['Fondo','Texto','Color que resalta','Ropa y decorado'];
    return `<div class="colors">${S.v_colores.map((c,k)=>`<label><input type="color" data-color="${k}" value="${c}">${names[k]}</label>`).join('')}</div>`; }
  if(f.kind==='yesno'){ const o = v||{};
    return `<div>${f.items.map((it,k)=>`<div class="yn"><span>${esc(it)}</span><div class="seg"><button type="button" class="${o[k]==='si'?'sel si':''} si" data-yn="${f.id}" data-k="${k}" data-v="si">Sí</button><button type="button" class="${o[k]==='no'?'sel no':''} no" data-yn="${f.id}" data-k="${k}" data-v="no">Todavía no</button></div></div>`).join('')}</div>`; }
  if(f.kind==='traps'){ const sel = v||[];
    return `<div class="traps">${f.items.map(t=>`<button type="button" class="trap ${sel.includes(t.t)?'sel':''}" data-tog="${f.id}" data-v="${esc(t.t)}"><div class="e">${t.e}</div><h4>${esc(t.t)}</h4><p>${esc(t.d)}</p></button>`).join('')}</div>
      <button type="button" class="mini-btn" data-none="${f.id}">${S[f.id+'_none']?'✓ ':''}No caigo en ninguna</button>`; }
  return '';
}
function rerenderField(fid){
  const f = fieldOf(fid);
  document.querySelectorAll('.wfield[data-field="'+fid+'"]').forEach(el=>{ el.innerHTML = inputHTML(f); });
}
function addOther(inp){
  const id=inp.dataset.other, f=fieldOf(id), v=inp.value.trim(); if(!v) return;
  let a=S[id]||[]; if(a.includes(v)){ inp.value=''; return; }
  if(f.max && a.length>=f.max){ toast('Máximo '+f.max+'. Sacá una tocándola.'); return; }
  S[id]=[...a,v]; save(); rerenderField(id);
}

/* ── editar una respuesta tocándola ── */
let EDITING = null;
function openEdit(fid){
  const f = fieldOf(fid); EDITING = fid;
  const m = $('#modal');
  m.innerHTML = '<div class="sheet"><span class="ps">EDITAR RESPUESTA</span><h3>'+esc(f.label)+'</h3><div class="wfield" data-field="'+fid+'">'+inputHTML(f)+'</div><div class="wfoot"><button class="btnp" type="button" data-close="1">Guardar ✓</button></div></div>';
  m.hidden = false;
  const first = m.querySelector('input[type=text],textarea'); if(first && !TOUCH) first.focus();
}
function closeEdit(){
  if(!EDITING) return; const fid = EDITING; EDITING = null;
  $('#modal').hidden = true; save(); refreshAnswers(fid); refreshLive(); refreshSide();
}

/* ── clicks y escritura en tarjetas ── */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.f){ S[t.dataset.f] = t.value; save(); refreshLive(); }
  if(t.dataset.color!==undefined){ S.v_colores[+t.dataset.color] = t.value; save(); refreshLive(); }
});
document.addEventListener('keydown', e=>{
  const t = e.target;
  if(t.dataset && t.dataset.other && e.key==='Enter'){ e.preventDefault(); addOther(t); }
  if(e.key==='Escape' && EDITING) closeEdit();
});
document.addEventListener('change', e=>{ if(e.target.dataset && e.target.dataset.other) addOther(e.target); if(e.target.type==='date' && e.target.dataset.f){ S[e.target.dataset.f]=e.target.value; save(); refreshLive(); } });
document.addEventListener('click', e=>{
  if(e.target.id==='modal'){ closeEdit(); return; }
  if(e.target.id==='scrim'){ document.body.classList.remove('menu'); return; }
  const b = e.target.closest('[data-edit],[data-tog],[data-none],[data-ch],[data-yn],[data-done],[data-copy],[data-close],[data-ins],[data-pdf],[data-jump]'); if(!b) return;
  const d = b.dataset;
  if(d.edit){ openEdit(d.edit); return; }
  if(d.close){ closeEdit(); return; }
  if(d.jump){ const el = document.getElementById(d.jump); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); document.body.classList.remove('menu'); return; }
  if(d.ins){ const inp = document.querySelector('.wfield [data-f="'+d.ins+'"]'); const cur = inp.value.trim(); inp.value = cur ? (cur.includes(d.v)?cur:cur+' + '+d.v) : d.v+' '; S[d.ins]=inp.value; save(); refreshLive(); inp.focus(); return; }
  if(d.tog){ const f = fieldOf(d.tog); let a = (S[d.tog]||[]).filter(x=>x!==NS);
    if(a.includes(d.v)) a = a.filter(x=>x!==d.v); else { if(f.max && a.length>=f.max){ toast('Máximo '+f.max+'. Tocá una elegida para sacarla.'); return; } a=[...a,d.v]; }
    S[d.tog]=a; if(f.kind==='traps') S[d.tog+'_none']=false; save(); rerenderField(d.tog); refreshLive(); return; }
  if(d.none){ S[d.none]=[]; S[d.none+'_none']=!S[d.none+'_none']; save(); rerenderField(d.none); return; }
  if(d.ch){ S[d.ch]=d.v; save(); rerenderField(d.ch); refreshLive(); return; }
  if(d.yn){ const o=S[d.yn]||{}; o[d.k]=d.v; S[d.yn]=o; save(); rerenderField(d.yn); return; }
  if(d.done){ const o=S['done_'+d.done]||{}; o[d.k]=!o[d.k]; S['done_'+d.done]=o; save(); b.classList.toggle('on', !!o[d.k]); return; }
  if(d.copy==='bio'){ navigator.clipboard && navigator.clipboard.writeText(bio()).then(()=>toast('Bio copiada ✓')).catch(()=>toast('No se pudo copiar: seleccioná el texto')); return; }
  if(d.pdf){ printAll(); return; }
});
$('#menuBtn').onclick = ()=>document.body.classList.toggle('menu');
$('#resetBtn').onclick = ()=>{
  if(!confirm('¿Borrar todas tus respuestas y empezar de cero? No se puede deshacer.')) return;
  try { localStorage.removeItem(KEY); localStorage.removeItem('pl3_pos'); localStorage.removeItem('pl3_step'); } catch(e){}
  location.reload();
};

/* ── costado: recorrido ── */
function curChapter(){ let c = -1; CHAPTERS.forEach((ci,k)=>{ if(ci < pos) c = k; }); return c; }
function refreshSub(){
  const s = $('#sub'); if(document.body.classList.contains('typing')){ s.textContent = '✎ Larry está escribiendo…'; return; }
  const c = curChapter();
  s.textContent = c<0 ? 'en línea · tu guía' : (c<STEPS.length ? 'Parada '+(c+1)+' de '+STEPS.length+' · '+STEPS[c].t : '★ Tu plan personalizado');
}
function refreshSide(){
  const c = curChapter();
  $('#route').innerHTML = '<div class="ps lbl">TU RECORRIDO</div>' + STEPS.map((s,k)=>{
    const reached = CHAPTERS[k] < pos, p = stepProgress(s), done = reached && p.n===p.total && c!==k;
    return '<button type="button" class="'+(c===k?'cur':'')+(reached?'':' lock')+'" '+(reached?'data-jump="sc-'+s.id+'"':'disabled')+'><span class="n">0'+(k+1)+'</span><span>'+esc(s.t)+'</span><span class="s">'+(done?'✓':(reached?'':s.min+'′'))+'</span></button>';
  }).join('') + '<button type="button" class="'+(c===STEPS.length?'cur':'')+(CHAPTERS[STEPS.length]<pos?'':' lock')+'" '+(CHAPTERS[STEPS.length]<pos?'data-jump="sc-final"':'disabled')+'><span class="n">★</span><span>Tu plan personalizado</span></button>';
  $('#pbar').style.width = (Math.max(0,c+1)/(STEPS.length+1)*100)+'%';
  refreshSub();
}

/* ════════════════════════════════════════════════════════════════════
   EXPORTAR (mismo formato que v2 → el Apps Script no cambia)
   ════════════════════════════════════════════════════════════════════ */
function answerText(f){
  const v = S[f.id];
  if(f.kind==='yesno') return f.items.map((it,k)=>`${(v||{})[k]==='si'?'Sí':((v||{})[k]==='no'?'Todavía no':'—')} · ${it}`).join('\n');
  if(f.kind==='traps') return S[f.id+'_none'] ? 'Ninguna' : val(f.id);
  if(f.kind==='colors') return `Fondo ${S.v_colores[0]} · Texto ${S.v_colores[1]} · Acento ${S.v_colores[2]} · Ropa y decorado ${S.v_colores[3]}`;
  return val(f.id);
}
function gatherManualData(){
  return STEPS.map((st,i)=>{
    const preguntas = st.fields.map(f=>({ pregunta:(f.group?f.group+' — ':'')+f.label, respuesta: answerText(f) }));
    if(st.id==='cap2') preguntas.push({pregunta:'Mi frase de posicionamiento (generada)', respuesta: val('s_genero')?posicionamiento(false):''});
    if(st.id==='cap4') preguntas.push({pregunta:'Mi bio de Instagram (generada)', respuesta: val('p_frase')?bio():''});
    const o = S['done_'+st.id]||{};
    return {
      id: st.id, titulo: `Paso ${i+1} · ${st.t}`,
      ejercicios: [{ label: `Paso ${i+1} · ${st.t}`, preguntas }],
      checklist: st.done ? { titulo: `Listo cuando… (${st.t})`, items: st.done.map((d,k)=>({ texto: typeof d==='string'?d:d.t, marcado: !!o[k] })) } : null
    };
  });
}
function buildContextText(capitulos){
  const lines=[];
  capitulos.forEach(c=>c.ejercicios.forEach(ex=>ex.preguntas.forEach(p=>{ if(p.respuesta) lines.push('P: '+p.pregunta+'\nR: '+p.respuesta); })));
  return lines.join('\n\n');
}
function callGeminiClient(prompt, maxTokens){
  return fetch(MANUAL_APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'generateText',prompt,maxTokens:maxTokens||4096})})
    .then(r=>r.json()).then(res=>{ if(res&&res.ok) return res.text; throw new Error((res&&res.error)||'No se pudo generar el texto.'); });
}



/* ── envío por chat: sube el plan a la carpeta de Drive del artista ── */
function wspURL(t){ return 'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(t); }
function fallbackCard(){
  const n = val('p_nombre') || 'un artista';
  return row('l', '<div class="mcard"><h3>¿No encontrás la carpeta?</h3><p class="note" style="margin-top:0">Escribime por WhatsApp y te la paso de nuevo. Cuando la tengas, pegá el link acá abajo.</p><div class="btnrow"><a class="btnw" target="_blank" rel="noopener" href="'+wspURL('Hola Larry! Soy '+n+'. No encuentro el link de mi carpeta de Drive para el Plan de Lanzamiento 🚀')+'">Pedirle la carpeta a Larry →</a></div></div>', 'wide');
}
function successCard(){
  const n = val('p_nombre');
  return row('l', '<div class="mcard"><h3>✓ ¡Listo, ya está en tu carpeta!</h3><p class="note" style="margin-top:0">Te subí <b>tu plan de 21 días</b> como documento de Google, con un título por día.</p><div class="btnrow">'+(S._docUrl?'<a class="btnw" style="text-decoration:none" target="_blank" rel="noopener" href="'+esc(S._docUrl)+'">Abrir mi plan en Drive ↗</a>':'')+'<a class="btnp" style="text-decoration:none" target="_blank" rel="noopener" href="'+wspURL('Hola Larry! Ya subí mi Plan de Lanzamiento 🚀 Soy '+n)+'">Avisarle a Larry →</a></div></div>', 'wide');
}
let SEND_FAILED = false;
function pdfFailCard(){
  return row('l', '<div class="mcard"><h3>Plan B: descargalo en PDF</h3><p class="note" style="margin-top:0">Probá pegar el link de nuevo. Si sigue sin andar, <b>descargá tu plan en PDF</b> y mandámelo por WhatsApp. No perdés nada.</p><div class="btnrow"><button class="btnw" data-pdf="1">⬇ Descargar en PDF</button></div></div>', 'wide');
}
function openSend(i){
  if(SEND_FAILED) qb('⬇ Descargar en PDF y ver mi plan', 'pri', ()=>{ printAll(); S._pdf = 1; save(); finish(i, ()=>row('u','<div class="ubub">Lo descargo en PDF</div>')); });
  qb('No la encuentro', 'ghost', ()=>{ row('u','<div class="ubub">No la encuentro</div>'); row('l','<div class="bub"><p class="vt">Sin drama, <b>te la paso de nuevo:</b></p></div>'); fallbackCard(); toBottom(); });
  openComposer('https://drive.google.com/drive/folders/...', '', ()=>{
    const link = cin.value.trim();
    if(!/drive\.google\.com/.test(link)){ row('l','<div class="bub err"><p class="vt">Mmm, eso no parece un link de Drive. Tiene que empezar con https://drive.google.com/…</p></div>'); toBottom(); return; }
    closeInput(); row('u','<div class="ubub">'+esc(link)+'</div>'); doSend(i, link);
  });
}
function doSend(i, driveLink){
  const artista = val('p_nombre') || 'Artista sin nombre';
  const msg = row('l','<div class="bub"><p class="vt">Subiendo tu plan a tu carpeta…</p></div>'); toBottom();
  const set = t => { msg.querySelector('.vt').textContent = t; };
  setTalking(true);
  let payload;
  try { payload = { artista, driveLink, respuestas: planRespuestas(), planTexto: planDocTexto() }; }
  catch(e){ fail('No pude armar el plan.'); return; }
  fetch(GUIA_APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) })
    .then(r=>r.json()).then(res=>{
      setTalking(false);
      if(res && res.ok){ S._sent = driveLink; if(res.url) S._docUrl = res.url; save(); set('¡Subido! 🎉'); successCard(); toBottom(); pos = i+1; savePos(); setTimeout(()=>stepFrom(i+1), 500); }
      else fail((res && res.error) || 'No se pudo enviar. Revisá el link de la carpeta.');
    }).catch(()=>fail('No se pudo conectar. Puede ser tu internet.'));
  function fail(m){
    setTalking(false); set('Uy, falló: '+m); msg.querySelector('.bub').classList.add('err');
    pdfFailCard(); toBottom(); SEND_FAILED = true; openInput(i);
  }
}

function printAll(){
  $('#printArea').innerHTML = planPrintHTML();
  setTimeout(()=>window.print(), 50);
}

/* ════════════════════════════════════════════════════════════════════
   ARRANQUE: reconstruye la charla guardada y sigue donde quedaste
   ════════════════════════════════════════════════════════════════════ */
function rebuild(){
  tin.innerHTML = '<div class="intro"><img class="logo" src="'+(LOGO_A||LOGO)+'" alt="Larry Prod"'+(LOGO_A?'':' style="opacity:0"')+'><h1>Tu lanzamiento en '+STEPS.length+' paradas.</h1><div class="byline">by <a href="https://www.instagram.com/larry.prod" target="_blank" rel="noopener">@larry.prod</a></div><div class="ps">CHAT PRIVADO · SE GUARDA SOLO</div></div>'
    + (()=>{ const ST = studioLayers(); return '<div class="scene" id="sc-cover"><div class="sbox">'+ST.back+'<div class="larry" data-frame="base"><div class="bob">'+LARRY_SVG.base+'</div></div>'+propHTML(GUIDE_COVER,'')+'</div><div class="scene-t"><span class="ps">TU GUÍA</span><h3>Larry</h3><a class="ps dim iglink" href="https://www.instagram.com/larry.prod" target="_blank" rel="noopener">PRODUCTOR · @LARRY.PROD ↗</a></div></div>'; })();
  setSide(null, true);
  pos = Math.min(pos, SCRIPT.length);
  for(let i=0; i<pos; i++){
    const b = SCRIPT[i];
    if(b.k==='go'){ row('u','<div class="ubub">'+esc(b.label)+'</div>'); continue; }
    if(b.k==='send'){ if(S._sent){ row('u','<div class="ubub">'+esc(S._sent)+'</div>'); successCard(); } else if(S._pdf) row('u','<div class="ubub">Lo descargo en PDF</div>'); continue; }
    larryPart(b, false);
    if(b.k==='ask') userAns(b.f, b.sub);
  }
  // si quedó en el medio de una parada, Larry vuelve a su pose
  const c = curChapter(); if(c>=0) setSide(SCRIPT[CHAPTERS[c]], true);
  refreshSide(); toBottom();
  if(pos>0 && pos<SCRIPT.length) row('c','<div class="ps" style="text-align:center;color:#fff;text-shadow:1px 1px 0 #2a1238;margin:6px 0">— SEGUIMOS DONDE LO DEJASTE —</div>');
  setTimeout(()=>stepFrom(pos), 400);
}
rebuild();
if (typeof planBind === 'function') planBind(document);
